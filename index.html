<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlyRank ML Internship Capstone — Refresh / Content Opportunity Scoring</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.7;
            color: #222;
            background: #f5f7fa;
            margin: 0;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            background: white;
            padding: 50px 65px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: #111827;
        }

        h2 {
            margin-top: 45px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            color: #1f2937;
        }

        h3 {
            margin-top: 30px;
            color: #374151;
        }

        p {
            margin: 15px 0;
        }

        li {
            margin: 6px 0;
        }

        code {
            background: #f1f3f5;
            padding: 2px 5px;
            border-radius: 4px;
        }

        pre {
            background: #f1f3f5;
            padding: 15px;
            overflow-x: auto;
            border-radius: 6px;
        }

        blockquote {
            border-left: 4px solid #999;
            margin-left: 0;
            padding-left: 20px;
            color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f1f3f5;
        }

        a {
            color: #2563eb;
        }

        .loading {
            text-align: center;
            color: #666;
        }

        @media (max-width: 700px) {
            .container {
                margin: 0;
                padding: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <div id="report" class="loading">
        Loading capstone report...
    </div>
</div>

<script>
    const reportUrl =
        "https://raw.githubusercontent.com/nandini2405/flyrank-ml-internship/main/work/capstone_report.md";

    fetch(reportUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load the report.");
            }
            return response.text();
        })
        .then(markdown => {
            document.getElementById("report").innerHTML =
                marked.parse(markdown);
        })
        .catch(error => {
            document.getElementById("report").innerHTML =
                "<h2>Unable to load report</h2>" +
                "<p>" + error.message + "</p>";
        });
</script>

</body>
</html>
