<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlyRank ML Internship Capstone — Refresh / Content Opportunity Scoring</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    
</head>

<body>


<script>
    const reportUrl =
        "https://raw.githubusercontent.com/nandini2405/flyrank-ml-internship/main/work/capstone_report.md";

    fetch(reportUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load the report.");
            }

            return response.text();
        })
        .then(markdown => {
            document.getElementById("report").innerHTML =
                marked.parse(markdown);
        })
        .catch(error => {
            document.getElementById("report").innerHTML =
                "<h2>Unable to load report</h2>" +
                "<p>" + error.message + "</p>";
        });
</script>

</body>
</html>
