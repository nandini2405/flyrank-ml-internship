<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlyRank ML Internship Capstone — Refresh / Content Opportunity Scoring</title>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #ffffff;
            color: #222222;
        }

        #report {
            max-width: 1100px;
            margin: 40px 0 40px 40px;
            padding: 0 30px 40px 0;
            text-align: left;
        }

        h1, h2, h3, h4 {
            text-align: left;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #cccccc;
            padding: 8px;
            text-align: left;
        }

        code {
            background: #f4f4f4;
            padding: 2px 4px;
        }

        pre {
            background: #f4f4f4;
            padding: 15px;
            overflow-x: auto;
        }
    </style>
</head>

<body>

<div id="report">
    <p>Loading report...</p>
</div>

<div id="chart-container" style="max-width: 900px; margin: 40px 40px 40px 40px;">
    <canvas id="resultsChart"></canvas>
</div>

<script>
    const reportUrl =
        "https://raw.githubusercontent.com/nandini2405/flyrank-ml-internship/main/work/capstone_report.md";

    fetch(reportUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error("Could not load the report.");
            }

            return response.text();
        })
        .then(markdown => {
    document.getElementById("report").innerHTML =
        marked.parse(markdown);

    const ctx = document.getElementById("resultsChart");

    if (ctx) {
        new Chart(ctx, {
            type: "bar",
            data: {
                labels: [
                    "Baseline",
                    "Logistic Regression",
                    "Decision Tree"
                ],
                datasets: [
                    {
                        label: "Precision@20",
                        data: [0.30, 0.80, 0.70]
                    },
                    {
                        label: "Precision@50",
                        data: [0.26, 0.74, 0.80]
                    },
                    {
                        label: "Average Precision",
                        data: [0.332, 0.647, 0.605]
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: "top"
                    },
                    title: {
                        display: true,
                        text: "Held-out ranking performance (May–June 2026)"
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 1,
                        title: {
                            display: true,
                            text: "Metric value (0–1)"
                        }
                    }
                }
            }
        });
    }
})
       
        .catch(error => {
            document.getElementById("report").innerHTML =
                "<h2>Unable to load report</h2>" +
                "<p>" + error.message + "</p>";
        });
</script>

</body>
</html>
